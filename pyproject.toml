[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-merkle-tree-state-proof-verifier-skill"
version = "1.0.0"
description = "Cryptographic Merkle tree constructor and inclusion proof generator/verifier with SHA-256 state leaves for immutable agent state attestation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
